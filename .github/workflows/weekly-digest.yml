name: Weekly Digest Rollup Email

# Fridays at 15:00 UTC (16:00 BST) — 10 hours after Friday's daily digest.
# This is a summary of the week's daily digests, not a fresh generation.
# The weekly rollup is composed by a small assembler script that reads the
# five most-recent dated daily digests from digests/ and stitches them
# into a single HTML with per-day sections and a top-of-week highlights
# summary derived from the audit report.

on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:

jobs:
  send-weekly-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check data integrity
        id: integrity
        run: |
          if ./scripts/check_data_integrity.sh; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble weekly rollup from the week's dailies
        id: assemble
        run: |
          python -m src.weekly_rollup --out WEEKLY_ROLLUP.html
          if [ -s WEEKLY_ROLLUP.html ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
            echo "Assembled WEEKLY_ROLLUP.html ($(wc -c < WEEKLY_ROLLUP.html) bytes)"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send weekly rollup
        if: steps.assemble.outputs.has_content == 'true' && steps.integrity.outputs.clean == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SEC Derivatives — Weekly Rollup"
          to: Lukas.becker@infopro-digital.com
          from: SEC Derivatives Bot <${{ secrets.SMTP_USERNAME }}>
          html_body: file://WEEKLY_ROLLUP.html

      - name: Notify no-dailies week
        if: steps.assemble.outputs.has_content == 'false' && steps.integrity.outputs.clean == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SEC Derivatives — no daily digests this week"
          to: Lukas.becker@infopro-digital.com
          from: SEC Derivatives Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            The weekly rollup workflow ran but found no dated daily digest
            files in digests/ for the last five weekdays.

            Either the digest routine did not fire at all this week, or it
            fired but its pushes never reached master. Check:
              ${{ github.server_url }}/${{ github.repository }}/commits/master

      - name: Notify that the rollup was withheld
        if: steps.assemble.outputs.has_content == 'true' && steps.integrity.outputs.clean != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SEC Derivatives — weekly rollup WITHHELD (data integrity regression)"
          to: Lukas.becker@infopro-digital.com
          from: SEC Derivatives Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            This week's rollup was assembled but NOT sent: the extracted
            data regressed against the recorded baseline. Any figures a
            reader might quote from it may be wrong.

            Run details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail if data integrity blocked the rollup
        if: steps.integrity.outputs.clean != 'true'
        run: exit 1
