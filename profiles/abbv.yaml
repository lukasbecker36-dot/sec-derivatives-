issuer: AbbVie
ticker: ABBV
cik: '1551152'
sector: Health Care
extraction_mode: llm

# Self-contained profile (no archetype line). AbbVie's Q2 filing consistently
# reports FX designated/non-designated notionals, IR swap notional, and the
# three derivative fair-value fields — nothing else. When the pipeline
# inherited the full minimal_hedger schema it kept trying to answer for
# has_derivatives, commodity_derivatives_notional, sensitivities etc., and
# produced wrong-column values that tripped implausible_swing on
# net_derivative_position. Trimming the schema to what the filing actually
# discloses removes those wrong-slot temptations.

sections:
  derivatives_note:
    heading: 'Note\s+\d+\s*[.\-:–—]?\s*(?:Derivative|Hedging)'
    match_strategy: last
    validation_keywords: [notional, derivative, hedge]
    end_boundary: 'Note\s+\d+\s*[.\-:–—]?\s*(?!Derivative|Hedging)'
    max_length: 10000

fields:
  fx_derivatives_notional:
    description: >-
      Total notional amount of foreign currency forward contracts outstanding,
      in millions. Sum of designated + non-designated below.
    section: derivatives_note
  fx_designated_notional:
    description: >-
      Notional amount of FX forwards designated as cash flow hedges, in
      millions.
    section: derivatives_note
  fx_not_designated_notional:
    description: >-
      Notional amount of FX forwards NOT designated as hedging instruments,
      in millions.
    section: derivatives_note
  ir_swap_notional:
    description: >-
      Notional amount of interest rate swaps outstanding, in millions.
    section: derivatives_note
  total_derivative_asset:
    description: >-
      Total derivative assets at fair value, in millions.
    section: derivatives_note
  total_derivative_liability:
    description: >-
      Total derivative liabilities at fair value, in millions.
    section: derivatives_note
  net_derivative_position:
    description: >-
      Net derivative asset/(liability) position, in millions
      (asset minus liability, positive = net asset).
    section: derivatives_note
  expected_12mo_reclass_from_aoci:
    description: >-
      Net gain/(loss) expected to be reclassified from AOCI to earnings in
      the next 12 months, in millions.
    section: derivatives_note

qualitative:
  sections_to_search: [derivatives_note]
  categories:
    Interest rate risk:
      - interest rate
      - basis point
      - 'floating.rate'
    FX exposure:
      - foreign currency
      - exchange rate
      - remeasur
    Policy changes:
      - de-designat
      - discontinued
      - terminat
      - unwind
    Event-driven:
      - deal contingent
      - 'acquisition.*hedg'

dashboard_mapping:
  total_derivatives_notional: "fx_derivatives_notional + ir_swap_notional"
  fx_hedging_notional: fx_derivatives_notional
