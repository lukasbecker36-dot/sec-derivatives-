issuer: Verizon
ticker: VZ
cik: "732712"
archetype: minimal_hedger
sector: TODO  # e.g., technology, industrials, financials
extraction_mode: llm

# Verizon's derivatives disclosure (the notional table: interest rate swaps,
# cross currency swaps, FX forwards, plus hedge activity) sits inside
# "Note 9. Fair Value Measurements and Financial Instruments" in the 10-K
# (Note 7 in 10-Qs). The minimal_hedger heading never matched it, so the
# content fallback sliced from the first "notional" mention, partway through
# a debt table, and the notional table was not in the text the model saw.
# The FY2025 10-K then came back with an FX total ($36,670m) that is not in
# the filing (36,074 + 570 = 36,644) and no designated figure. The note runs
# to ~15,000 characters with the table about a third of the way in.
sections:
  derivatives_note:
    heading: 'Note\s+\d+\.\s+Fair\s+Value\s+Measurements\s+and\s+Financial\s+Instruments'
    end_boundary: 'Note\s+\d+\.\s+(?!Fair\s+Value)[A-Z][a-z]+'
    match_strategy: last
    max_length: 16000

# Additional fields identified by LLM analysis (review and adjust)
fields:
  fixed_rate_debt_pct:
    description: "Percentage of total debt that is fixed-rate including effect of interest rate swaps"
    section: market_risk
  ir_swap_notional:
    description: "Total notional amount of interest rate swaps"
    section: market_risk
  ir_swap_fair_value_liability:
    description: "Fair value liability of interest rate swap contracts"
    section: market_risk
  cross_currency_swap_notional:
    description: "Total notional amount of cross currency swaps"
    section: market_risk
  cross_currency_swap_fair_value_asset:
    description: "Fair value asset of cross currency swap contracts"
    section: market_risk
  cross_currency_swap_fair_value_liability:
    description: "Fair value liability of cross currency swap contracts"
    section: market_risk
  fx_forward_notional:
    description: "Total notional amount of foreign exchange forwards"
    section: market_risk
  interest_rate_sensitivity_100bp:
    description: "Change in annual interest expense from 100bp change on floating rate debt"
    section: market_risk
  long_term_debt_fair_value:
    description: "Fair value of long-term debt and related derivatives"
    section: market_risk
  collateral_posted:
    description: "Collateral posted related to derivative contracts"
    section: market_risk

# Unusual features identified:
#   - Very large derivatives program - $23.7B IR swaps and $36.1B cross currency swaps
#   - Interest rate swaps designated as fair value hedges
#   - Cross currency swaps hedge multiple currencies (GBP, EUR, CHF, CAD, AUD)
#   - FX forwards not designated for hedge accounting
#   - Detailed sensitivity table with +/- 100bp shifts for debt and derivatives
#   - Significant collateral posting ($1.1B) under CSA agreements

