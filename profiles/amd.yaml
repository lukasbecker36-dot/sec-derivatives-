issuer: Advanced Micro Devices
ticker: AMD
cik: '2488'
sector: Information Technology
extraction_mode: llm

# Self-contained profile. AMD's derivatives disclosure sits mainly in the
# Financial Instruments note (fair values for cash, securities, and FX
# forwards) with the notionals repeated in a Derivatives note. A market
# risk section carries the debt-related sensitivity discussion. The prior
# archetype's has_derivatives / commodity / cross-currency ask produced
# wrong-slot values that hit implausible_swing on marketable_equity_securities.

sections:
  financial_instruments:
    heading: 'Note\s+\d+\s*[.\-:–—]?\s*Financial\s+Instruments'
    match_strategy: first
    validation_keywords: [fair value, marketable, derivative]
    end_boundary: 'Note\s+\d+\s*[.\-:–—]?\s*(?!Financial\s+Instruments)'
    max_length: 12000
  derivatives_note:
    heading: 'Note\s+\d+\s*[.\-:–—]?\s*(?:Derivative|Hedging)'
    match_strategy: last
    validation_keywords: [notional, derivative, forward]
    end_boundary: 'Note\s+\d+\s*[.\-:–—]?\s*(?!Derivative|Hedging)'
    max_length: 10000
  market_risk:
    heading: 'Quantitative and Qualitative Disclosures About Market Risk'
    match_strategy: last
    end_boundary: 'Item\s*[\s\xa0]*[489]'
    max_length: 8000

fields:
  total_cash_equivalents_fv:
    description: >-
      Total cash equivalents at fair value, in millions.
    section: financial_instruments
  total_marketable_securities_fv:
    description: >-
      Total marketable securities at fair value, in millions.
    section: financial_instruments
  corporate_debt_securities_fv:
    description: >-
      Corporate debt securities at fair value, in millions.
    section: financial_instruments
  gross_unrealized_gains_debt:
    description: >-
      Gross unrealized gains on marketable debt securities, in millions.
      Enter 0 if the filing states "not material".
    section: financial_instruments
  marketable_equity_securities_fv:
    description: >-
      Marketable equity securities at fair value, in millions.
    section: financial_instruments
  fi_fx_derivatives_notional:
    description: >-
      Total FX derivative notional (Financial Instruments note), in millions.
    section: financial_instruments
  fi_fx_designated_notional:
    description: >-
      Designated FX derivative notional (Financial Instruments note), in
      millions.
    section: financial_instruments
  fi_fx_not_designated_notional:
    description: >-
      Non-designated FX derivative notional (Financial Instruments note), in
      millions.
    section: financial_instruments
  fx_derivatives_notional:
    description: >-
      Total FX derivative notional (Derivatives note), in millions.
    section: derivatives_note
  fx_designated_notional:
    description: >-
      Designated FX derivative notional (Derivatives note), in millions.
    section: derivatives_note
  fx_not_designated_notional:
    description: >-
      Non-designated FX derivative notional (Derivatives note), in millions.
    section: derivatives_note
  net_derivative_position:
    description: >-
      Net derivative asset/(liability) position, in millions.
    section: derivatives_note
  marketable_equity_value:
    description: >-
      Marketable equity securities value for equity price risk purposes,
      in millions.
    section: market_risk

qualitative:
  sections_to_search: [financial_instruments, derivatives_note, market_risk]
  categories:
    FX exposure:
      - foreign currency
      - exchange rate
    Equity investments:
      - marketable equity
      - equity method
      - measurement alternative
    Policy changes:
      - de-designat
      - discontinued
      - terminat

dashboard_mapping:
  total_derivatives_notional: fx_derivatives_notional
  fx_hedging_notional: fx_derivatives_notional
