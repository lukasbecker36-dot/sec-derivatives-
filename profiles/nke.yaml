issuer: Nike, Inc.
ticker: NKE
cik: "320187"
archetype: minimal_hedger
sector: TODO  # e.g., technology, industrials, financials
extraction_mode: llm

# Nike titles its derivatives footnote "NOTE 12 — RISK MANAGEMENT AND
# DERIVATIVES" (NOTE 7 in 10-Qs). The minimal_hedger heading expects
# "Derivative"/"Hedging" straight after the note number, so it never matched
# and the content fallback grabbed the first "notional" mention instead —
# in a 10-K that is the Note 1 accounting policy, so every 10-K row came back
# with no notionals or AOCI. Match the real heading. NOTE is case-sensitive
# (all caps in Nike's headings) so in-text references such as "refer to
# Note 4 — Fair Value Measurements" don't end the section early. The slice
# deliberately runs on through the next note (ACCUMULATED OTHER COMPREHENSIVE
# INCOME), which follows directly in both forms and holds the cash flow hedge
# AOCI balance. Together they run to ~15,000 characters in the 10-K, with the
# notional paragraphs near the end, so the default 10,000 cap would cut them.
sections:
  derivatives_note:
    heading: '(?-i:NOTE)\s+\d+\s*[—–-]\s*RISK\s+MANAGEMENT\s+AND\s+DERIVATIVES'
    end_boundary: '(?-i:NOTE)\s+\d+\s*[—–-]\s*(?!\s|RISK\s+MANAGEMENT|ACCUMULATED\s+OTHER)'
    max_length: 16000

# Additional fields identified by LLM analysis (review and adjust)
fields:
  fx_forward_var:
    description: "Value-at-Risk for foreign currency forward and option derivatives (one-day, 95% confidence)"
    section: market_risk
  interest_rate_swap_notional:
    description: "Notional amount of interest rate swaps by maturity ($2,400M total)"
    section: market_risk
  interest_rate_swap_fair_value:
    description: "Fair value of interest rate swaps ($21M)"
    section: market_risk
  fixed_rate_swap_avg_rates:
    description: "Average fixed (3.6%) and variable (3.8%) interest rates on swaps"
    section: market_risk
  long_term_debt_principal:
    description: "Long-term fixed rate debt principal by expected maturity year ($8,000M total)"
    section: market_risk
  long_term_debt_fair_value:
    description: "Fair value of long-term fixed rate debt ($6,673M)"
    section: market_risk
  fx_hedge_currency_pairs:
    description: "Primary hedged currency pairs: EUR/USD, CNY/USD, GBP/EUR, JPY/USD"
    section: market_risk
  average_monthly_fx_derivative_change:
    description: "Average monthly change in fair value of FX derivatives ($200M fiscal 2025)"
    section: market_risk

# Unusual features identified:
#   - Uses Value-at-Risk (VaR) model with variance/covariance technique rather than simple sensitivity analysis
#   - Detailed expected maturity date table for debt and interest rate swaps
#   - Interest rate swaps swap fixed to variable (fair value hedges), not the typical variable to fixed
#   - FX hedging program hedges 12-24 months ahead with incremental hedges up to 100% of exposure
#   - Separate Note 12 - Risk Management and Derivatives referenced but not included in this section
#   - Fiscal year ending May 31

