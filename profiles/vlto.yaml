issuer: Veralto
ticker: VLTO
cik: "1967680"
sector: Industrials
extraction_mode: llm

# No archetype: Veralto's derivatives disclosure is a numbered note captioned
# "NOTE 13. DERIVATIVES AND HEDGING TRANSACTIONS" (ALL-CAPS, no "Note N" title
# match under the archetype's pattern). Real content: $410M cross-currency swap
# contracts designated as net investment hedges plus $584M of euro-denominated
# debt used as a nonderivative net-investment hedge. Fully self-contained.
sections:
  derivatives_note:
    heading: 'NOTE 13\. DERIVATIVES AND HEDGING TRANSACTIONS'
    match_strategy: last
    end_boundary: 'NOTE 14\. PENSION'
    max_length: 7000

fields:
  has_derivatives:
    description: "Does the company use derivatives? Yes/No/No mention"
    section: derivatives_note
  cross_currency_swap_notional:
    description: "Notional amount of cross-currency swap contracts designated as net investment hedges, in millions (e.g. $410)"
    section: derivatives_note
  net_investment_hedge_debt:
    description: "Carrying amount of foreign-currency (euro) denominated long-term debt designated as a nonderivative net investment hedge, in millions (e.g. $584)"
    section: derivatives_note
  oci_gains_losses:
    description: "Pre-tax gains (losses) on net investment hedges recognized in other comprehensive income, in millions"
    section: derivatives_note
  derivative_fair_values:
    description: "Fair value of derivative instruments recorded on the balance sheet, in millions"
    section: derivatives_note
