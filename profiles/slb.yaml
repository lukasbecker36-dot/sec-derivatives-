issuer: Schlumberger
ticker: SLB
cik: "87347"
sector: Energy
extraction_mode: llm

# No archetype: SLB's derivatives note is a bare numbered caption ("10.
# Derivative Instruments and Hedging Activities") and the archetype's fields
# pointed at a nonexistent market_risk section. Real content: cross-currency
# interest rate swaps (two euro tranches of ~€0.5bn each), foreign exchange
# forward contracts, and credit default swaps issued with an aggregate notional
# of ~$0.6 billion. Fully self-contained.
sections:
  derivatives_note:
    heading: '10\. Derivative Instruments and Hedging Activities'
    match_strategy: last
    end_boundary: '11\. Stockholders'
    max_length: 7000

fields:
  has_derivatives:
    description: "Does the company use derivatives? Yes/No/No mention"
    section: derivatives_note
  cross_currency_swap_notional:
    description: "Notional amount of cross-currency interest rate swaps, in billions of euro (e.g. two ~€0.5bn tranches)"
    section: derivatives_note
  fx_forward_notional:
    description: "Notional amount of foreign exchange forward contracts, in millions"
    section: derivatives_note
  cds_notional:
    description: "Aggregate notional amount of credit default swaps (CDSs) issued, outstanding at period end, in billions (e.g. $0.6 billion)"
    section: derivatives_note
  derivative_fair_values:
    description: "Fair value of derivative instruments designated and not designated as hedges, in millions"
    section: derivatives_note
