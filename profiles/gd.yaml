issuer: General Dynamics
ticker: GD
cik: "40533"
archetype: minimal_hedger
sector: TODO  # e.g., technology, industrials, financials
extraction_mode: llm

# General Dynamics uses lettered notes in ALL CAPS: "Q. DERIVATIVE FINANCIAL
# INSTRUMENTS AND HEDGING ACTIVITIES" in the 10-K, "N. ..." in 10-Qs. The
# minimal_hedger heading expects "Note <number>", so it never matched and the
# content fallback sliced from the first "notional" mention -- in the 10-K
# that is Item 7A (MD&A), not the footnote. The slice starts one note earlier,
# at "FAIR VALUE" (directly preceding in both forms), because that note's
# table holds the only derivative fair values (cash flow hedge assets /
# liabilities); the derivatives note itself carries the forward-contract
# notional under "Hedging Activities." Ends at the next lettered caps heading
# (R. EQUITY COMPENSATION PLANS / O. RETIREMENT PLANS); ~8,000 chars.
# Letters are case-sensitive and must not follow a "." (so "U.S. GAAP" etc.
# never end the slice).
sections:
  derivatives_note:
    heading: '(?<![.\w])(?-i:[A-Z])\.\s+(?-i:FAIR\s+VALUE)\s+(?=Fair\s+value\s+is\s+defined)'
    match_strategy: last
    end_boundary: '(?<![.\w])(?-i:[A-Z])\.\s+(?!\s|DERIVATIVE)(?-i:[A-Z]{4,}\b)'
    max_length: 16000

# Additional fields identified by LLM analysis (review and adjust)
fields:
  fx_forward_notional:
    description: "notional amount of forward exchange contracts outstanding"
    section: market_risk
  fx_sensitivity_recognized:
    description: "hypothetical pretax losses from 10% adverse rate movement - recognized"
    section: market_risk
  fx_sensitivity_unrecognized:
    description: "hypothetical pretax losses from 10% adverse rate movement - unrecognized"
    section: market_risk
  fixed_rate_debt_principal:
    description: "principal amount of fixed-rate debt"
    section: market_risk
  primary_currencies:
    description: "Canadian dollar, euro and Swiss franc"
    section: market_risk

# Unusual features identified:
#   - Sensitivity analysis splits losses into 'Recognized' and 'Unrecognized' categories
#   - References external note for commodity price and investment risk details
#   - Uses 10% adverse rate movement for sensitivity analysis rather than standard basis point movements
#   - Explicitly states hedged instruments offset underlying exposure losses

