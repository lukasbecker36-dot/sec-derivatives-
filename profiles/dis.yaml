issuer: "Walt Disney Company (The)"
ticker: DIS
cik: "1744489"
archetype: minimal_hedger
extraction_mode: llm

# Disney numbers its footnotes without the word "Note": the derivatives
# footnote is "17 Derivative Instruments" in the 10-K and "14. Derivative
# Instruments" in 10-Qs. The minimal_hedger heading requires "Note N", so it
# never matched and the content fallback sliced 10,000 chars from the first
# "notional" mention -- in the 10-K that is the Item 7A interest-rate table,
# so the footnote's notional paragraphs were missed. Match the bare-numbered
# heading (title case, case-sensitive) and end at the next bare-numbered
# title-case note heading ("18 Restructuring and Impairment Charges" /
# "15. Restructuring and Impairment Charges"). The 10-Q note opens with
# "...measured at fair value (see Note 13)", which the extractor's
# cross-reference filter would treat as a stub, so the heading optionally
# swallows that first parenthetical reference. The note is ~10,000 chars in
# the 10-K and ~7,000 in 10-Qs.
sections:
  derivatives_note:
    heading: '\b\d{1,2}\.?\s+(?-i:Derivative\s+Instruments)(?:[^()]{0,80}\(see\s+Note\s+\d+\))?'
    end_boundary: '(?-i:\s\d{1,2}\.?\s+(?!Derivative)[A-Z][a-z]+\s+(?:and\s+)?[A-Z][a-z]+)'
    max_length: 16000

# Derivatives section matched by: ITEM\s*7A
# Market risk section matched by: Quantitative\s+and\s+Qualitat\s*ive\s+Disclosures?\s+About\s+Market\s+Risk

