issuer: Amgen
ticker: AMGN
cik: "318154"
archetype: minimal_hedger
sector: TODO  # e.g., technology, industrials, financials
extraction_mode: llm

# Amgen numbers its footnotes without the word "Note": the derivatives
# footnote is "19. Derivative instruments" in the 10-K and "12. Derivative
# instruments" in 10-Qs. The minimal_hedger heading requires "Note N", so it
# never matched and the content fallback sliced 10,000 chars from the first
# "notional" mention -- in the 10-K that is MD&A liquidity, so the footnote's
# notional figures (FX forwards, cross-currency swaps, IR swaps, non-designated
# forwards) were missed. In-text references are "Note 19, Derivative
# instruments" (comma), so requiring "N." excludes them. The slice ends at the
# next "N. Title" heading ("20. Contingencies and commitments" /
# "13. Contingencies and commitments"). The note runs ~16,000 chars, so the
# cap is raised above that in case the boundary is ever missed.
sections:
  derivatives_note:
    heading: '\b\d{1,2}\.\s+(?-i:Derivative\s+instruments)'
    end_boundary: '\b\d{1,2}\.\s+(?!Derivative)(?-i:[A-Z][a-z]+\s+(?:and\s+)?[a-z]+)'
    max_length: 20000

# Additional fields identified by LLM analysis (review and adjust)
fields:
  interest_rate_swap_notional:
    description: "aggregate notional amount of interest rate swap contracts"
    section: market_risk
  cross_currency_swap_notional:
    description: "aggregate notional amount of cross-currency swap contracts"
    section: market_risk
  fx_forward_fair_values:
    description: "fair values of foreign currency forward contracts (assets and liabilities)"
    section: market_risk
  foreign_currency_debt_carrying_value:
    description: "carrying value and fair value of euro/pound sterling denominated debt"
    section: market_risk
  sensitivity_analysis_100bp:
    description: "impact of 100 basis point interest rate changes on derivative fair values"
    section: market_risk
  sensitivity_analysis_20pct_fx:
    description: "impact of 20% foreign exchange rate changes on derivative fair values"
    section: market_risk

# Unusual features identified:
