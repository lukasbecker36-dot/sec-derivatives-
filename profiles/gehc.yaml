issuer: GE HealthCare
ticker: GEHC
cik: "1932393"
archetype: minimal_hedger
sector: TODO  # e.g., technology, industrials, financials
extraction_mode: llm

# GE HealthCare's derivatives disclosure sits inside "NOTE 13. FINANCIAL
# INSTRUMENTS AND FAIR VALUE MEASUREMENTS" (NOTE 12 in 10-Qs), under the
# sub-heading "DERIVATIVES AND HEDGING". The archetype heading expects
# "Note N. Derivative/Hedging" straight after the number, so it never matched
# and the content fallback grabbed the first "notional" mention -- in the
# 10-K that is Item 7A, so the Gross Notional table was missed. Match the
# all-caps note heading (case-sensitive, so the mixed-case table-of-contents
# entry is skipped) and end at the next all-caps NOTE heading. The 10-K note
# runs ~17,000 chars, the 10-Q note ~14,300.
sections:
  derivatives_note:
    heading: '(?-i:NOTE)\s+\d+\.\s+(?-i:FINANCIAL\s+INSTRUMENTS\s+AND\s+FAIR\s+VALUE)'
    end_boundary: '(?-i:NOTE\s+\d+\.\s+(?!FINANCIAL\s+INSTRUMENTS)[A-Z]{3,})'
    max_length: 18000

# Additional fields identified by LLM analysis (review and adjust)
fields:
  gross_notional_amounts:
    description: "notional amounts by instrument type"
    section: market_risk
  fair_value_assets:
    description: "positive fair values by instrument type"
    section: market_risk
  fair_value_liabilities:
    description: "negative fair values by instrument type"
    section: market_risk
  hedge_designations:
    description: "cash flow, fair value, net investment hedge classifications"
    section: market_risk
  maximum_hedge_maturity:
    description: "maximum remaining maturity periods"
    section: market_risk
  expected_reclassification:
    description: "amounts expected to be reclassified from AOCI"
    section: market_risk
  currency_sensitivity:
    description: "10% USD weakening impact on derivative fair values"
    section: market_risk
  basis_adjustments:
    description: "cumulative fair value hedge basis adjustments on borrowings"
    section: market_risk
  cash_flow_settlements:
    description: "cash settlement amounts for net investment hedges"
    section: market_risk

# Unusual features identified:
#   - Accrued interest treatment changed between periods (included in 2025, excluded in 2024)
#   - Cross-currency swaps used in combination with FX forwards and options for net investment hedging
#   - Embedded derivatives identified in purchase/sales contracts
#   - Spot method used for net investment hedge effectiveness testing
#   - Systematic recognition of excluded components from net investment hedges
#   - Market risk section provides currency sensitivity analysis excluding net investment hedges

